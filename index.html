<title>宿のはじめて帳 延対寺荘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width app column, role switch on top, tab bar at the bottom (five for staff, six for admin).
   Indigo (藍) ink on a pale washi grey; moss green is the one accent; rust is reserved for "ask a person". */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1b2430; --muted:#5d6670; --line:#dde2dc;
  --ai:#24426a; --ai-soft:#e4eaf3; --moss:#557532; --moss-soft:#e7eedc;
  --warn:#a5461f; --warn-soft:#f7e6dc; --scrim:rgba(10,14,20,.55); --skin:#f0cfb4; --skin2:#e3bb9c; --collar:#f4f2ec;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171e; --surface:#1a212b; --ink:#e6eaee; --muted:#9aa4ae; --line:#2b3440;
  --ai:#9fb8dc; --ai-soft:#22304a; --moss:#a6c47c; --moss-soft:#26321c;
  --warn:#f0a07b; --warn-soft:#3a2418; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e; --surface:#1a212b; --ink:#e6eaee; --muted:#9aa4ae; --line:#2b3440;
  --ai:#9fb8dc; --ai-soft:#22304a; --moss:#a6c47c; --moss-soft:#26321c;
  --warn:#f0a07b; --warn-soft:#3a2418; --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 104px}
.app{max-width:480px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

header.top{padding-block:16px 8px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand h1{font-size:1.45rem;color:var(--ai)}
.aibadge{font-size:.72rem;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.aibadge.on{background:var(--moss-soft);color:var(--moss);border-color:transparent;font-weight:700}
.demo-note{font-size:.78rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--ai);font-size:.78rem;font-weight:700;padding:0;text-decoration:underline}
.role{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.role button{border:0;background:transparent;border-radius:999px;padding:7px 8px;font-size:.88rem;color:var(--muted)}
.role button[aria-pressed="true"]{background:var(--ai);color:var(--surface);font-weight:700}

main{padding-top:8px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.empty{color:var(--muted);font-size:.88rem}
.tap{font-size:.75rem;color:var(--muted)}
.hero{background:var(--ai);color:var(--surface);border:0}
.hero .label{color:var(--ai-soft)}
.hero .when{font-size:2rem;font-family:var(--display);font-variant-numeric:tabular-nums;line-height:1.2}
.hero .count{display:inline-block;background:var(--surface);color:var(--ai);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;align-self:flex-start}
dl.kv{display:grid;grid-template-columns:5.5em 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
dl.kv dd{margin:0;min-width:0}

.todo{display:flex;flex-direction:column;gap:6px}
.todo button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:.8rem;color:var(--surface)}
.done .box,.box.on{background:var(--moss);border-color:var(--moss)}
.todo button.done span.t{color:var(--muted);text-decoration:line-through}
.todo .go{margin-left:auto;font-size:.75rem;color:var(--ai);font-weight:700;white-space:nowrap}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{display:flex;gap:10px;align-items:center;border:0;background:none;padding:6px;margin:-6px;border-radius:10px;text-align:left;width:100%}
.person:hover{background:var(--bg)}
.avatar{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:var(--ai-soft)}
.avatar svg,.avatar img,.portrait svg,.portrait img{width:100%;height:100%;display:block;object-fit:cover}
.person b{display:block;font-size:.92rem}
.person span{font-size:.78rem;color:var(--muted)}
.call{font-size:.78rem;color:var(--moss);font-weight:700}

.seg{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px;align-self:flex-start}
.seg button{border:0;background:none;border-radius:999px;padding:3px 14px;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ai);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.map{overflow-x:auto}
.map svg{width:100%;min-width:0;height:auto;display:block}
.room{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.room.key{fill:var(--moss-soft);stroke:var(--moss)}
.room.guest{fill:var(--surface)}
.maptext{fill:var(--ink);font-size:12px;font-family:var(--body)}
.maptext.small{fill:var(--muted);font-size:10px}
.route{stroke:var(--moss);stroke-width:2.5;fill:none;stroke-dasharray:6 5}
.pin{fill:var(--moss)}
.floors{display:grid;grid-template-columns:2.2em repeat(4,minmax(0,1fr));gap:3px;font-size:.68rem;line-height:1.3}
.floors .h{font-weight:700;text-align:center;color:var(--ai);font-family:var(--display);font-size:.85rem;padding-bottom:2px}
.floors .f{display:grid;place-items:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.floors .c{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 4px;min-height:2.6em;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;font-variant-numeric:tabular-nums}
.floors .c.none{background:none;border-color:transparent}
.floors .c .k{color:var(--moss);font-weight:700}
.floors .c .o{color:var(--muted)}
.fac{border-top:1px solid var(--line);padding:7px 0}
.fac:first-child{border-top:0;padding-top:0}
.fac b{display:block}
.fac span{display:block;font-size:.82rem;color:var(--muted)}
.faq .note{display:block}
.faq span[lang]{display:block;color:var(--muted);font-size:.88rem}
.faq{display:flex;flex-direction:column;gap:6px}
.faq>div{border-top:1px solid var(--line);padding-top:6px}
.faq>div:first-child{border-top:0;padding-top:0}
.faq b{display:block}
.sos{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;border:0;border-radius:999px;padding:10px 16px;font-weight:700;background:var(--warn);color:var(--surface);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.sos.up{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
.fb{display:flex;gap:6px;margin-top:6px}
.fb button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:.75rem;color:var(--muted)}
.tour{position:sticky;top:0;z-index:6;border:2px solid var(--ai);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.nextcard{border:2px solid var(--moss)}
details.card.fold{display:block}
details.card.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.card.fold>summary::-webkit-details-marker{display:none}
details.card.fold>summary::after{content:"開く";font-size:.75rem;color:var(--ai);font-weight:700;white-space:nowrap}
details.card.fold[open]>summary::after{content:"閉じる"}
details.card.fold[open]>*:not(summary){margin-top:10px}
button.stat{text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column}
html.big{font-size:117%}
html.big body{font-size:17.5px}
.voice{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.voice:first-child{border-top:0;padding-top:0}
details.term{border-top:1px solid var(--line);padding-block:8px}
details.term:first-of-type{border-top:0}
details.term summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.term summary::-webkit-details-marker{display:none}
details.term summary::after{content:"＋";color:var(--muted)}
details.term[open] summary::after{content:"－"}
details.term p{color:var(--muted);font-size:.9rem;padding-top:4px}

.lesson-list{display:flex;flex-direction:column;gap:8px}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.lesson b{display:block}
.lesson span{font-size:.8rem;color:var(--muted)}
.status{font-size:.75rem;padding:2px 10px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.status.done{background:var(--moss-soft);color:var(--moss);border-color:transparent;font-weight:700}
.status.own{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.player{aspect-ratio:16/9;max-width:100%;border-radius:10px;background:linear-gradient(135deg,var(--ai),var(--ink));color:var(--surface);position:relative;overflow:hidden;border:0;width:100%;padding:0;display:block}
.player .play{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;border:2px solid var(--surface);display:grid;place-items:center;font-size:1.2rem}
.player .sub{position:absolute;left:12px;right:12px;bottom:24px;font-size:.88rem;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6);min-height:1.4em}
.player .meta{position:absolute;left:10px;right:10px;top:8px;display:flex;justify-content:space-between;font-size:.75rem;font-variant-numeric:tabular-nums}
.player .pbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.25)}
.player .pbar i{display:block;height:100%;width:0;background:var(--moss)}
ol.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
ol.steps li::marker{color:var(--ai);font-weight:700}
.stepchk{display:flex;flex-direction:column;gap:6px}
.stepchk button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.stepchk .n{font-family:var(--display);color:var(--ai);font-weight:700;min-width:1.2em}
.stepchk button.on{background:var(--moss-soft);border-color:transparent}
.diff{background:var(--ai-soft);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:.88rem}
.diff b{color:var(--ai)}
.ng{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:.88rem}
.ng b{color:var(--warn)}
.ng ul{margin:4px 0 0;padding-left:1.2em}
a.btn{text-decoration:none;display:inline-block}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--ai);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ai);border:1px solid var(--ai)}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{border:0;background:none;color:var(--ai);padding:0;font-weight:700;align-self:flex-start}

.chat{display:flex;flex-direction:column;gap:10px;min-height:240px}
.msg{max-width:86%;padding:9px 13px;border-radius:14px;font-size:.92rem;white-space:pre-line;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ai);color:var(--surface);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot.esc{background:var(--warn-soft);border-color:transparent}
.msg.bot.wait{color:var(--muted)}
.msg .src{display:block;margin-top:4px;font-size:.72rem;color:var(--muted)}
.composer{display:flex;gap:8px;position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
.suggest{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.suggest button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem}

.q{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.opt.right{border-color:var(--moss);background:var(--moss-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.why{font-size:.86rem;color:var(--muted);border-left:3px solid var(--moss);padding-left:10px}
.score{font-family:var(--display);font-size:2.2rem;color:var(--moss);font-variant-numeric:tabular-nums;line-height:1.2}
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.picker button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem}
.picker button[aria-pressed="true"]{background:var(--ai);color:var(--surface);border-color:var(--ai);font-weight:700}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale button b{font-family:var(--display);font-size:1.1rem}
.scale button[aria-pressed="true"]{background:var(--ai);color:var(--surface);border-color:var(--ai)}
.scale-ends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
textarea,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem}
textarea{min-height:72px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .num{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .num small{font-size:.8rem;font-family:var(--body);color:var(--muted)}
.stat .delta{font-size:.78rem;color:var(--moss);font-weight:700}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:4.5em 1fr 3.5em;gap:8px;align-items:center;font-size:.85rem}
.bar .track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--ai)}
.bar .fill.after{background:var(--moss)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.nlist{display:flex;flex-direction:column}
.nrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;text-align:left;width:100%}
.nrow:first-child{border-top:0}
.nrow b{display:block}
.nrow .sub{font-size:.78rem;color:var(--muted)}
.prog{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--moss)}
.tag{font-size:.7rem;padding:1px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.risk{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:700}
.tag.ok{background:var(--moss-soft);color:var(--moss);border-color:transparent;font-weight:700}
.qitem{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.qitem:first-child{border-top:0;padding-top:0}
.out{background:var(--moss-soft);border-radius:10px;padding:12px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.note{font-size:.78rem;color:var(--muted)}
.err{font-size:.82rem;color:var(--warn)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));z-index:5}
nav.tabs .inner{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-family:var(--display);font-size:1.05rem;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--ai);font-weight:700}
nav.tabs .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--warn);color:var(--surface);font-size:.62rem;display:grid;place-items:center;padding:0 4px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20;display:grid;place-items:end center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:420px;max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.portrait{width:180px;height:180px;max-width:100%;border-radius:50%;background:var(--ai-soft);overflow:hidden}
.say{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:.9rem;width:100%}
.upload{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.upload input{font-size:.8rem;max-width:100%}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .2s ease}}
@keyframes fade{from{opacity:.4}to{opacity:1}}

/* ---- UI polish (v13): same palette and roles; adds depth, touch targets, and a calmer hero ---- */
:root{--hero:#24426a;--hero-ink:#ffffff;--hero-soft:#c9d6ea;--hero-line:rgba(255,255,255,.22);--shadow:0 1px 2px rgba(27,36,48,.05),0 6px 18px rgba(27,36,48,.05);--press:rgba(27,36,48,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero:#1c3152;--hero-ink:#eef3fa;--hero-soft:#a9bcd8;--hero-line:rgba(255,255,255,.16);--shadow:0 1px 2px rgba(0,0,0,.35);--press:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--hero:#1c3152;--hero-ink:#eef3fa;--hero-soft:#a9bcd8;--hero-line:rgba(255,255,255,.16);--shadow:0 1px 2px rgba(0,0,0,.35);--press:rgba(255,255,255,.06)}
.brand h1{display:flex;align-items:center;gap:10px;letter-spacing:.02em}
.brand h1::before{content:"帳";display:grid;place-items:center;width:1.5em;height:1.5em;border-radius:7px;background:var(--hero);color:var(--hero-ink);font-size:.78em;line-height:1;flex:none}
.demo-note{border-style:solid;border-radius:12px;padding:8px 12px}
.demo-note .linkbtn{text-decoration:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-weight:500;color:var(--ink);min-height:28px}
.demo-note .row{gap:6px!important}
.role{box-shadow:var(--shadow)}
.role button{min-height:40px;transition:background .15s,color .15s}
.card{border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:1.18rem}
.hero{background:var(--hero);color:var(--hero-ink);position:relative;overflow:hidden;padding:18px;gap:12px;box-shadow:none}
.hero .label{color:var(--hero-soft)}
.hero .when{font-size:clamp(1.7rem,8vw,2.1rem);letter-spacing:.01em;position:relative}
.hero .count{background:var(--hero-ink);color:var(--hero)}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;position:relative;z-index:1}
.hero-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.92rem;border-top:1px solid var(--hero-line);padding-top:10px;position:relative;z-index:1}
.hero-meta dt{color:var(--hero-soft);font-size:.8rem;align-self:center}
.hero-meta dd{margin:0;min-width:0}
.ring{width:58px;height:58px;flex:none;position:relative}
.ring svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--hero-line);stroke-width:5}
.ring .pg{fill:none;stroke:var(--hero-ink);stroke-width:5;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.82rem;font-variant-numeric:tabular-nums}
.nextcard{border-width:1px;border-color:var(--moss);background:var(--moss-soft);box-shadow:none}
.nextcard .label{color:var(--moss)}
.btn{min-height:44px;transition:transform .08s,filter .15s}
.btn.small{min-height:36px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.ghost{background:var(--surface)}
.todo button,.stepchk button,.opt,.lesson,.ojt button{min-height:48px;transition:background .15s,border-color .15s}
.todo button:active,.stepchk button:active,.opt:active:not(:disabled),.lesson:active,.nrow:active,.person:active{background:var(--press)}
.lesson{box-shadow:var(--shadow);border-radius:14px;padding:14px 16px}
.stepchk .n{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--ai-soft);min-width:1.7em;font-size:.9rem;font-family:var(--body)}
.stepchk button.on .n{background:var(--moss);color:var(--surface)}
.stat .num{color:var(--ai)}
.stat{box-shadow:none;background:var(--bg)}
button.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:background .15s}
button.stat:active{background:var(--press)}
details.card.fold>summary{min-height:32px}
details.card.fold>summary::after{border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg)}
details.card.fold>summary h2{font-size:1.08rem}
.suggest,.picker{scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.suggest::-webkit-scrollbar,.picker::-webkit-scrollbar{display:none}
.suggest button,.picker button{min-height:36px;padding:6px 14px;box-shadow:var(--shadow)}
.msg{line-height:1.65;padding:10px 14px;border-radius:16px}
.msg.bot{box-shadow:var(--shadow)}
.msg.bot.esc{border-left:3px solid var(--warn);box-shadow:none}
.composer{gap:8px;padding:8px;margin-inline:-8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.10)}
.composer input{border:0;background:transparent;min-height:40px}
.composer input:focus-visible{outline:0}
.composer:focus-within{border-color:var(--ai)}
.fb button{min-height:30px}
nav.tabs{box-shadow:0 -4px 16px rgba(0,0,0,.05)}
nav.tabs button{padding:6px 2px 8px;gap:3px;min-height:54px}
nav.tabs button .ic{padding:3px 14px;border-radius:999px;transition:background .15s}
nav.tabs button[aria-current="page"] .ic{background:var(--ai-soft)}
nav.tabs .dot{top:2px;right:calc(50% - 26px)}
.toast{box-shadow:0 6px 20px rgba(0,0,0,.2);padding:10px 18px}
.sos{display:flex;align-items:center;gap:8px;padding:10px 16px 10px 10px}
.sos[hidden]{display:none}
.sosin{background:var(--warn);color:var(--surface);border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem;min-height:36px}
.player{background:linear-gradient(135deg,var(--hero),var(--hero) 40%,#14233b);color:var(--hero-ink)}
.player .play{border-color:var(--hero-ink)}
.sos::before{content:"?";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--warn);font-weight:700;font-size:.9rem}
.sheet-card{border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet-card::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex:none}
.tour{top:calc(env(safe-area-inset-top,0px) + 6px);background:var(--surface)}
.floors .c{border-radius:8px}
.fcard{box-shadow:var(--shadow);background:var(--surface)}
textarea,.field input,.field select{min-height:42px;border-radius:10px}
textarea:focus-visible,.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--ai);outline-offset:1px}
.tag{padding:2px 9px}
.score{color:var(--moss)}
@media (prefers-reduced-motion:no-preference){.sheet-card{animation:rise .22s ease}.toast{animation:rise .2s ease}}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
html.big .ring{width:66px;height:66px}
</style>

let vTimer=null;
function stopVideo(){ if(vTimer){ clearInterval(vTimer); vTimer=null; } }
function playVideo(L){
  if(vTimer){ stopVideo(); $("#playicon").textContent="▶"; return; }
  const [m,s] = L.time.split(":").map(Number), total=m*60+s;
  let t = 0; const dur = 9000; $("#playicon").textContent="❚❚";
  vTimer = setInterval(()=>{
    t += 100; const r = Math.min(1,t/dur), sec = Math.round(total*r);
    const bar=$("#vbar"); if(!bar){ stopVideo(); return; }
    bar.style.width = (r*100)+"%";
    $("#vtime").textContent = `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")} / ${L.time}`;
    $("#vsub").textContent = L.steps[Math.min(L.steps.length-1, Math.floor(r*L.steps.length))];
    if(r>=1){ stopVideo(); $("#playicon").textContent="↻"; $("#vsub").textContent="見終わりました。手順を押して確認しましょう";

function findHTML(q){
  const t=String(q||"").trim().toLowerCase(); if(!t) return "";

  const res=[];
  const rm=t.match(/^(\d{3})(号室)?$/);
  if(rm){ const n=+rm[1], R=[["蘭亭",[[311,315],[411,415],[511,515],[611,615],[711,715]]],["菊亭",[[301,306],[401,406],[501,509],[601,608]]],["梅亭",[[221,225],[321,325],[421,427],[521,526]]],["竹亭",[[205,212]]]];
    const hit=R.find(([,rs])=>rs.some(([x,y])=>n>=x&&n<=y));

       <div class="row"><button class="btn small" data-reply="${q.id}">回答して資料に追加</button>${aiOK()?`<button class="btn ghost small" data-draft="${q.id}">AIで回答案を作る</button>`:""}</div>`}
    </div>`).join(""):`<p class="empty">いまは回答待ちの質問はありません。</p>`}</section>
  ${done.length?`<section class="card"><h3>回答済み（宿の資料に追加）</h3>${done.map(q=>`<div class="qitem"><b>${esc(q.q)}</b><span class="empty">${esc(q.reply||"本人に直接対応")}</span></div>`).join("")}</section>`:""}`;
}
function keywords(q){
  const k = q.replace(/[？?。、！!「」]/g," ").split(/\s+/).filter(w=>w.length>=2);
  if(!k.length) k.push(q.slice(0,6));
  const extra = ["地酒","お酒","日本酒","駐車場","制服","洗濯","売店","お土産","温泉","チェックアウト","トロッコ","冬","運休"];
  extra.forEach(w=>{ if(q.includes(w)) k.push(w); });
  if(q.includes("地酒")) k.push("お酒","日本酒");
  return k;
}

function heuristicLesson(title,text){
  const sents = text.replace(/はい、?|じゃあ|そう、?|ね。/g,"").split(/[。]/).map(s=>s.trim()).filter(s=>s.length>4);
  const steps = sents.filter(s=>!/絶対|しないで|ないで/.test(s)).slice(0,6).map(s=>s.replace(/^(まず|次に|それから|あと、?)/,"").trim()+"。");
  const ng = sents.filter(s=>/絶対|しないで|ないで/.test(s)).map(s=>s.trim());
  return {steps, ng, quiz:[{q:"この手順で、最初にすることは？", o:[steps[0]||"広げる","最後の仕上げ","片づけ"], a:0, why:"動画の最初の手順です。"}]};
}

  const title=$("#a-title").value.trim()||"新しい手順", text=$("#a-text").value.trim();

  const btn=$("#mklesson"); btn.disabled=true; btn.textContent="作っています…";
  let r=null;
  if(aiOK()){

stepsは4〜6個、quizは3問。`;
    try{ r=await sample.json(prompt,{modelTier:"default"}); if(!r||!Array.isArray(r.steps)||!r.steps.length) r=null; }
    catch(e){ const m=aiErr(e); if(m){ const el=$("#aerr"); el.hidden=false; el.textContent=m; } }
  }
  if(!r) r=heuristicLesson(title,text);
  const quiz=(r.quiz||[]).filter(q=>q&&Array.isArray(q.o)&&q.o.length>=2).map(q=>({q:String(q.q),o:q.o.map(String),a:Math.max(0,Math.min(q.o.length-1,Number(q.a)||0)),why:String(q.why||"")}));

  document.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.prep; if(k==="lessons") return go("learn"); if(k==="quiz") return go("quiz");
    state.prep[k]=!state.prep[k]; render(); });
  document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{state.lesson=b.dataset.lesson;render();window.scrollTo(0,0)});
  const back=$("#back"); if(back) back.onclick=()=>{state.lesson=null;render()};
  const L = state.lesson && lessons().find(l=>l.id===state.lesson);
  const pl=$("#play"); if(pl&&L) pl.onclick=()=>playVideo(L);
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const a=(state.steps[L.id] ||= []); a[+b.dataset.step]=!a[+b.dataset.step]; render()});
  const md=$("#markdone"); if(md) md.onclick=()=>{state.done[state.lesson]=true;toast("見終わった記録を残しました");render()};
  const tq=$("#toquiz"); if(tq) tq.onclick=()=>{state.quizLesson=state.lesson; go("quiz")};
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  const f=$("#composer"); if(f) f.onsubmit=e=>{e.preventDefault();const v=$("#askinput").value.trim();if(v)say(v)};
  if(askCtl){ const sb=$("#sendbtn"); if(sb) sb.disabled=true; }
  document.querySelectorAll("[data-ql]").forEach(b=>b.onclick=()=>{state.quizLesson=b.dataset.ql;render()});
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const id=state.quizLesson, ans=(state.quiz[id] ||= {}); ans[b.dataset.q]=+b.dataset.o;
    const Lq=lessons().find(l=>l.id===id);
    if(Object.keys(ans).length===Lq.quiz.length){ state.scores[id]=`${Lq.quiz.filter((q,i)=>ans[i]===q.a).length}/${Lq.quiz.length}`; }
    render()});
  const qd=$("#qdone"); if(qd) qd.onclick=()=>{
    const id=state.quizLesson; (state.qdone ||= {})[id]=true; state.done[id]=true;
    const withQuiz=lessons().filter(l=>l.quiz&&l.quiz.length);
    const next=withQuiz.find(l=>!(state.qdone[l.id]));
    if(next){ state.quizLesson=next.id; toast("完了しました。次は「"+next.title+"」のテストです"); render(); window.scrollTo(0,0); }
    else { toast("すべての確認テストが完了しました"); go("sheet"); } };
  const r2=$("#retry2"); if(r2) r2.onclick=()=>{state.quiz[state.quizLesson]={};render();window.scrollTo(0,0)};
  const r=$("#retry"); if(r) r.onclick=()=>{state.quiz[state.quizLesson]={};render();window.scrollTo(0,0)};
  document.querySelectorAll("[data-cv]").forEach(b=>b.onclick=()=>{const [i,v]=b.dataset.cv.split(":").map(Number); state.checkin.text=($("#ctext")||{}).value??state.checkin.text; state.checkin.vals[i]=v; render()});
  const ct=$("#ctext"); if(ct) ct.oninput=()=>{state.checkin.text=ct.value; save()};
  const cs=$("#csend"); if(cs) cs.onclick=()=>{state.checkin.sent=true; render(); toast("教育担当に送りました")};
  const rc=$("#recheck"); if(rc) rc.onclick=()=>{state.checkin.sent=false; render()};
  document.querySelectorAll("[data-nb]").forEach(b=>b.onclick=()=>{state.newbieView=+b.dataset.nb;render();window.scrollTo(0,0)});
  const nb=$("#nback"); if(nb) nb.onclick=()=>{state.newbieView=null;render()};
  document.querySelectorAll("[data-reply]").forEach(b=>b.onclick=()=>{
    const q=state.queue.find(x=>x.id==b.dataset.reply), txt=$("#reply-"+q.id).value.trim();
    if(!txt){toast("回答を入力してください");return}
    q.answered=true; q.reply=txt;
    state.learned.push({k:keywords(q.q), a:txt, src:"女将の回答"});
    state.chat.push({who:"bot", text:`「${q.q}」への${HOST}からの回答です。\n${txt}`, src:"担当者からの回答"});
    toast("資料に追加しました。次からは質問係が答えます"); render()});
  document.querySelectorAll("[data-draft]").forEach(b=>b.onclick=async()=>{
    const q=state.queue.find(x=>x.id==b.dataset.draft); b.disabled=true; b.textContent="作っています…";
    try{ const {text}=await sample(`旅館「${INN}」の女将として、新人スタッフの質問への回答案を2文で書いてください。宿の資料にない固有名詞（商品名や店名）は「◯◯」と伏せ字にし、女将が埋められるようにしてください。回答文だけを返してください。\n宿の資料：\n${kbText()}\n質問：${q.q}`,{modelTier:"quick"}); q.draft=text.trim(); }
    catch(e){ const m=aiErr(e); if(m) toast(m); }
    render()});
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const q=state.queue.find(x=>x.id==b.dataset.done); q.answered=true; toast("対応済みにしました");render()});
  const ds=$("#dorm-save"); if(ds) ds.onclick=async()=>{
    const rec={address:$("#dorm-addr").value.trim(), steps:$("#dorm-steps").value.split("\n").map(x=>x.trim()).filter(Boolean), at:Date.now()};
    state.dorm=rec; toast("道案内を保存しました"); render(); };
  const gs=$("#gosheet"); if(gs) gs.onclick=()=>{ const t=$("#daysheet"); if(t) t.closest(".card").scrollIntoView({behavior:"smooth",block:"start"}); };
  const fq=$("#findq"); if(fq) fq.oninput=()=>{ const o=$("#findout"); o.innerHTML=findHTML(fq.value);
    o.querySelectorAll("[data-flesson]").forEach(b=>b.onclick=()=>{ state.tab="learn"; state.lesson=b.dataset.flesson; render(); window.scrollTo(0,0); });
    o.querySelectorAll("[data-fgo]").forEach(b=>b.onclick=()=>go(b.dataset.fgo)); };
  const si=$("#sosinline"); if(si) si.onclick=()=>openSOS();
  document.querySelectorAll("[data-tour]").forEach(b=>b.onclick=()=>{ const a=b.dataset.tour; if(a==="close") setTour(null); else if(a==="prev") setTour(state.tour-1); else setTour(state.tour+1>=TOUR.length?null:state.tour+1); });
  document.querySelectorAll("details[data-fold]").forEach(d=>d.ontoggle=()=>{ (state.open ||= {})[d.dataset.fold]=d.open; save(); });
  document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{ const k=b.dataset.next;
    if(k==="lessons") return go("learn"); if(k==="quiz") return go("quiz");
    const t = k==="sheet" ? ($("#daysheet")&&$("#daysheet").closest(".card")) : $("#bringcard"); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); });
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const g=$("#gen"); if(g) g.onclick=generate;
  const rg=$("#regen"); if(rg) rg.onclick=()=>{state.gen=null;render()};
  const pb=$("#publish"); if(pb) pb.onclick=()=>{
    const gg=state.gen;
    state.profile={name:gg.name,type:gg.type,job:gg.job,date:gg.date,time:gg.time,meet:"施設で確認",host:gg.host,schedule:gg.schedule,bring:gg.bring,welcome:gg.welcome};
    state.gen=null; setRole("new"); toast(`${gg.name}さんに初日シートを送りました`)};
  const ml=$("#mklesson"); if(ml) ml.onclick=makeLesson;
  document.querySelectorAll("[data-eff]").forEach(inp=>inp.oninput=()=>{state.eff[inp.dataset.eff]=inp.value; $("#effout").innerHTML=effCalc(); save()});
  document.querySelectorAll("[data-memo]").forEach(b=>b.onclick=()=>{const i=b.dataset.memo; const m=(state.memo[i] ||= {ok:false,text:""}); m.ok=!m.ok; render()});
  document.querySelectorAll("[data-memotext]").forEach(t=>t.oninput=()=>{const i=t.dataset.memotext; const m=(state.memo[i] ||= {ok:false,text:""}); m.text=t.value; save()});
  const sn=$("#seenew"); if(sn) sn.onclick=()=>{setRole("new"); go("learn")};
}
function setRole(r){state.role=r;state.tab=r==="new"?"sheet":"dash";state.lesson=null;state.newbieView=null;
  $("#role-new").setAttribute("aria-pressed",r==="new");$("#role-admin").setAttribute("aria-pressed",r==="admin");render();window.scrollTo(0,0)}
$("#tourbtn").onclick=()=>setTour(0);
$("#sosbtn").onclick=()=>openSOS();
$("#bigtxt").onclick=()=>{ state.big=!state.big; applyBig(); save(); render(); };
$("#role-new").onclick=()=>setRole("new");
$("#role-admin").onclick=()=>setRole("admin");
$("#reset").onclick=()=>{ try{localStorage.removeItem(KEY)}catch(e){} state=fresh(); staff.forEach(s=>delete s.photo); applyBig(); setRole("new"); toast("デモを最初の状態に戻しました"); };
$("#role-new").setAttribute("aria-pressed",state.role==="new");$("#role-admin").setAttribute("aria-pressed",state.role==="admin");
applyBig();
render();
</script>
